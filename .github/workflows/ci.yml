name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Lowest total statement coverage that still passes. Raise it as tests are added.
  COVERAGE_FLOOR: "48"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Unused code and dependencies
        run: npx --yes knip@5 --no-progress
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  go:
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Unreachable code
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          $out = deadcode ./...
          if ($out) { $out; throw "deadcode found unreachable functions" }

      - name: Vulnerable dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test with coverage
        shell: bash
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Coverage report
        shell: bash
        run: |
          go tool cover -html=coverage.out -o coverage.html
          go tool cover -func=coverage.out > coverage.txt
          total=$(awk '/^total:/ { gsub("%", "", $3); print $3 }' coverage.txt)
          {
            echo "## Go test coverage"
            echo
            echo "**Total: ${total}%** (floor ${COVERAGE_FLOOR}%)"
            echo
            echo "Least covered functions:"
            echo
            echo "| Function | Coverage |"
            echo "| --- | --- |"
            grep -v '^total:' coverage.txt | awk '{ v=$NF; gsub("%", "", v); print v, $1, $2 }' | sort -n | head -15 | awk '{ print "| " $2 " " $3 " | " $1 "% |" }'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Total coverage: ${total}%"
          awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { if (t + 0 < f + 0) { print "coverage " t "% is below the floor of " f "%"; exit 1 } }'

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
            coverage.txt

      - name: Upload to Codecov (optional)
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Installer module
        shell: bash
        working-directory: installer
        run: |
          touch payload/trimmel.exe
          go vet ./...
          go build ./...
