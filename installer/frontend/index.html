<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trimmel Setup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffc25a" />
        <stop offset="1" stop-color="#ff9d6c" />
      </linearGradient>
    </defs>
  </svg>

  <div id="setup">
    <aside class="side">
      <div class="side-glow"></div>
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#3B2A3F"/><rect x="10" y="38" width="44" height="12" rx="3.5" fill="#FFF8F1"/><path d="M15 38 C15 27 25 20 34 20 C44 20 49.5 27.5 45.5 33 C42.2 37.2 36 34.5 38.5 29.8" fill="none" stroke="#FFC25A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>trimmel</span>
      </div>
      <ol class="steps" id="steps"></ol>
      <div class="side-foot"><span id="ver"></span></div>
    </aside>

    <main class="main">
      <div class="titlebar">
        <div class="drag"></div>
        <button class="wbtn" id="min" aria-label="Minimise">&#8211;</button>
        <button class="wbtn close" id="close" aria-label="Close">&#10005;</button>
      </div>
      <div id="screen"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
